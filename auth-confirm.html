<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>Confirm access · Xenora CRM</title>
    <style>
      :root {
        color: #18181b;
        background: #f4f4f5;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(100%, 440px);
        padding: 32px;
        border: 1px solid #e4e4e7;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 16px 40px rgb(0 0 0 / 8%);
        text-align: center;
      }
      .brand {
        margin: 0 0 28px;
        font-size: 18px;
        font-weight: 700;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 26px;
        line-height: 1.2;
      }
      p {
        margin: 0;
        color: #52525b;
        line-height: 1.6;
      }
      a {
        display: block;
        margin-top: 28px;
        padding: 12px 18px;
        border-radius: 9px;
        background: #18181b;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover {
        background: #27272a;
      }
      .error {
        margin-top: 20px;
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Xenora CRM</p>
      <h1 data-confirm-title>Confirm secure access</h1>
      <p data-confirm-description>
        Review this request, then continue to Xenora CRM.
      </p>
      <a data-confirm-button hidden>Continue</a>
      <p class="error" data-confirm-error hidden>
        This link is incomplete or invalid. Request a new email from your CRM
        administrator.
      </p>
    </main>
    <script type="module" src="/src/auth-confirm.ts"></script>
  </body>
</html>
